version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://clinicpro_user:clinicpro_secure_pass@db:5432/clinicpro?schema=public
      - JWT_SECRET=clinicpro-production-secret-key-super-secure
      - NEXT_PUBLIC_APP_NAME=ClinicPro
      - NEXT_PUBLIC_DEFAULT_CURRENCY=BDT
      - NEXT_PUBLIC_DEFAULT_CURRENCY_SYMBOL=৳
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: clinicpro_user
      POSTGRES_PASSWORD: clinicpro_secure_pass
      POSTGRES_DB: clinicpro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicpro_user -d clinicpro"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
